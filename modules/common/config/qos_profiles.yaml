# QoS Profiles Configuration for PilotZero - 当前架构简化版
# Key驱动设计：只保留必要的传感器QoS配置

qos_profiles:
  # 传感器数据QoS - 适用于IMU等高频传感器
  sensor:
    history: keep_last
    depth: 1
    reliability: best_effort
    durability: volatile
    deadline:
      sec: 0
      nsec: 100000000  # 100ms
    lifespan:
      sec: 0
      nsec: 500000000  # 500ms
    liveliness: automatic
    liveliness_lease_duration:
      sec: 1
      nsec: 0
    avoid_ros_namespace_conventions: false
# 当前Key驱动架构只需要传感器QoS，其他配置已删除
# TODO: 后续根据需要添加特定的QoS配置
